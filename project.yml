name: DesktopMascot
options:
  createIntermediateGroups: true
  deploymentTarget:
    # 14.4, not 14.0, for NSHostingMenu. The menu bar item is built as an
    # NSStatusItem the app owns (see AppDelegate.statusItem) so macOS cannot
    # remember it as removed and leave the app unlaunchable; NSHostingMenu is
    # what lets that item keep the existing SwiftUI MenuBarContent instead of a
    # second, hand-written AppKit copy of the same menu. Raised 2026-08-03.
    macOS: "14.4"
  xcodeVersion: "26.0"
packages:
  DesktopMascotKit:
    path: Packages/DesktopMascotKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  # Built as a native tool target rather than copied from SwiftPM output, so the
  # helper inside the bundle is produced by the same build that produces the app
  # and cannot drift from it.
  dockpet-event:
    type: tool
    platform: macOS
    sources:
      - path: Packages/DesktopMascotKit/Sources/dockpet-event
    dependencies:
      - package: DesktopMascotKit
        product: MascotCore
      - package: DesktopMascotKit
        product: MascotTransport
    settings:
      base:
        PRODUCT_NAME: dockpet-event
        CODE_SIGN_STYLE: Automatic

  DesktopMascot:
    type: application
    platform: macOS
    sources:
      - path: DesktopMascot/App
      - path: art/animation/mascot-atlas@2x.png
        buildPhase: resources
      # Deterministically authored from the frozen atlas by
      # tools/author_codex_fashion_atlas.py. It preserves every pose and the
      # entire lower outfit while changing the top and glasses only.
      - path: art/animation/mascot-atlas-codex@2x.png
        buildPhase: resources
      - path: art/animation/atlas-contract.json
        buildPhase: resources
      # Generated by tools/author_sound_effects.py, not recorded. Regenerate
      # rather than editing the WAVs by hand.
      - path: art/audio/success.wav
        buildPhase: resources
      - path: art/audio/failure.wav
        buildPhase: resources
      - path: art/audio/summon.wav
        buildPhase: resources
      - path: art/audio/dismiss.wav
        buildPhase: resources
    dependencies:
      - package: DesktopMascotKit
        product: MascotCore
      - package: DesktopMascotKit
        product: MascotAnimation
      - package: DesktopMascotKit
        product: MascotWindow
      - package: DesktopMascotKit
        product: MascotTransport
      # Rides along inside the bundle so a provider hook has a stable absolute
      # path to invoke. It is a plain executable, not a login item or an XPC
      # service: nothing launches it except a hook, one event at a time.
      - target: dockpet-event
        embed: true
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mrshine09.desktopmascot
        PRODUCT_NAME: Dock Pet
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: Dock Pet
        INFOPLIST_KEY_LSUIElement: true
        # Rendered from the frozen mascot base by tools/render_app_icon.py. An
        # accessory app has no Dock tile, but the icon still shows in Finder,
        # Get Info, and system alerts.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
schemes:
  DesktopMascot:
    build:
      targets:
        DesktopMascot: all
    run:
      config: Debug
    archive:
      config: Release
