name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The art is generated by deterministic scripts, so a drifted atlas is a real
  # failure rather than a cosmetic one. This job is cheap and runs first.
  art:
    name: Validate art contract
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install Pillow

      - name: Validate the contract and the frozen base
        run: python3 tools/validate_animation_atlas.py --contract-only

      - name: Validate the classic navy atlas
        run: python3 tools/validate_animation_atlas.py --atlas art/animation/mascot-atlas@2x.png

      # Not validated with the same command as the classic atlas: this one is a
      # deterministic derivative that adds three orange shades outside the
      # frozen 12-color palette, by design. The validator correctly reports
      # them, so only its geometry is checked here. See
      # tools/author_codex_fashion_atlas.py.
      - name: Check the derived atlas geometry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          from PIL import Image

          contract = json.loads(Path("art/animation/atlas-contract.json").read_text())
          expected = tuple(contract["atlas"]["pixel_size"])
          for name in ("mascot-atlas@2x.png", "mascot-atlas-codex@2x.png"):
              with Image.open(Path("art/animation") / name) as image:
                  if image.size != expected:
                      raise SystemExit(f"{name} is {image.size}, contract says {expected}")
                  print(f"OK: {name} {image.size}")
          PY

  test:
    name: Swift package tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Run tests
        working-directory: Packages/DesktopMascotKit
        # The runner's home directory is writable, but pinning the module caches
        # keeps a cache-permission failure from looking like a compile error.
        env:
          CLANG_MODULE_CACHE_PATH: /tmp/dockpet-clang-cache
          SWIFTPM_MODULECACHE_OVERRIDE: /tmp/dockpet-swiftpm-cache
        run: swift test

  build:
    name: Build the app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      # project.yml is the source of truth and the .xcodeproj is committed.
      # Regenerating and diffing catches the case where someone hand-edited the
      # project, or changed project.yml and forgot to regenerate.
      - name: Check the Xcode project is in sync with project.yml
        run: |
          xcodegen generate
          if ! git diff --quiet -- DesktopMascot.xcodeproj; then
            echo "::error::DesktopMascot.xcodeproj is out of sync with project.yml."
            echo "Run 'xcodegen generate' and commit the result."
            git diff --stat -- DesktopMascot.xcodeproj
            exit 1
          fi
          echo "Xcode project matches project.yml"

      - name: Build
        run: |
          xcodebuild \
            -project DesktopMascot.xcodeproj \
            -scheme DesktopMascot \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      # The app is only as correct as the art it actually ships. A resource that
      # silently fails to copy produces a running app with an invisible mascot.
      - name: Verify the bundled atlas matches the workspace
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Debug/Dock Pet.app"
          cmp art/animation/mascot-atlas@2x.png "$APP/Contents/Resources/mascot-atlas@2x.png"
          cmp art/animation/mascot-atlas-codex@2x.png "$APP/Contents/Resources/mascot-atlas-codex@2x.png"
          cmp art/animation/atlas-contract.json "$APP/Contents/Resources/atlas-contract.json"
          test -x "$APP/Contents/MacOS/dockpet-event"
          echo "Bundled resources match the workspace"
